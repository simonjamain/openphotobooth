<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenPhotobooth</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #1a1a1a;
        color: #f0f0f0;
        gap: 1.5rem;
      }
      h1 {
        font-size: 2rem;
        letter-spacing: 0.05em;
      }
      #capture-btn {
        padding: 1rem 2.5rem;
        font-size: 1.25rem;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        background: #e05;
        color: #fff;
        transition: opacity 0.2s;
      }
      #capture-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #status {
        font-size: 1rem;
        color: #aaa;
        min-height: 1.5em;
        text-align: center;
      }
      #status.error {
        color: #f55;
      }
    </style>
  </head>
  <body>
    <h1>OpenPhotobooth</h1>
    <button id="capture-btn">📷 Capture</button>
    <p id="status">Ready</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
