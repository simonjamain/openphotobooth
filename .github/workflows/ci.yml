name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]

# Default: read-only access for all jobs; override per-job where writes are needed.
permissions:
  contents: read

jobs:
  # ─── Test ──────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ─── Build (Windows installer) ────────────────────────────────────────────
  build:
    name: Build Windows Installer
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
    # Build on every push to main AND on every release.
    if: github.event_name == 'push' || github.event_name == 'release'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tauri application
        run: npm run tauri:build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenPhotobooth-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ─── Upload to GitHub Release ──────────────────────────────────────────────
  release-upload:
    name: Upload Release Assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to attach files to a GitHub Release
    if: github.event_name == 'release'

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenPhotobooth-windows-installer
          path: release/

      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe

